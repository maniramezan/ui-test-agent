id: "delete-v1-tasks-param"
alias: "Delete one task."
reference_name: "deleteTask"
method: "DELETE"
path: "/v1/tasks/{id}"
tags: ["tasks"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true

variants:
  - name: "noContent"
    reference_name: "noContent"
    description: "Deleted."
    default: true
    status: 204
  - name: "unauthorized"
    reference_name: "unauthorized"
    description: "The bearer token or the session cookie is missing, expired or wrong."
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks-param/v1-tasks-id-unauthorized.json"
  - name: "notFound"
    reference_name: "notFound"
    description: "No such task."
    status: 404
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks-param/v1-tasks-id-notfound.json"
  - name: "serverError"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks-param/v1-tasks-id-servererror.json"
