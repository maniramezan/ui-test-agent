id: "patch-v1-tasks-param"
alias: "Change a task's title, notes or done state."
reference_name: "updateTask"
method: "PATCH"
path: "/v1/tasks/{id}"
tags: ["tasks"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true
  requires_body: true
  accepted_content_types:
    - "application/json"

variants:
  - name: "ok"
    reference_name: "ok"
    description: "The changed task."
    default: true
    status: 200
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-ok.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    description: "The bearer token or the session cookie is missing, expired or wrong."
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-unauthorized.json"
  - name: "notFound"
    reference_name: "notFound"
    description: "No such task."
    status: 404
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-notfound.json"
  - name: "unprocessableContent"
    reference_name: "unprocessableContent"
    description: "The body failed validation; `fields` names each problem."
    status: 422
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-unprocessablecontent.json"
  - name: "serverError"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-servererror.json"
