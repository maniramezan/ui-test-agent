id: "patch-v1-tasks-param"
alias: "Change a task's title, notes or done state."
reference_name: "updateTask"
method: "PATCH"
path: "/v1/tasks/{id}"
tags: ["tasks"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true
  requires_body: true
  accepted_content_types:
    - "application/json"

variants:
  - name: "success"
    reference_name: "success"
    default: true
    status: 200
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-success.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-unauthorized.json"
  - name: "not-found"
    reference_name: "notFound"
    status: 404
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-not-found.json"
  - name: "invalid"
    reference_name: "invalid"
    status: 422
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-invalid.json"
  - name: "server-error"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/patch-v1-tasks-param/v1-tasks-id-server-error.json"
