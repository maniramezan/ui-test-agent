id: "get-v1-me"
alias: "The signed-in user."
reference_name: "getMe"
method: "GET"
path: "/v1/me"
tags: ["session"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true

variants:
  - name: "ok"
    reference_name: "ok"
    description: "The user."
    default: true
    status: 200
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/get-v1-me/v1-me-ok.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    description: "The bearer token or the session cookie is missing, expired or wrong."
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/get-v1-me/v1-me-unauthorized.json"
