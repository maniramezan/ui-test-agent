id: "delete-v1-tasks"
alias: "Delete every task of the user."
reference_name: "deleteAllTasks"
method: "DELETE"
path: "/v1/tasks"
tags: ["tasks"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true

variants:
  - name: "success"
    reference_name: "success"
    default: true
    status: 200
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks/v1-tasks-success.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks/v1-tasks-unauthorized.json"
  - name: "server-error"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/delete-v1-tasks/v1-tasks-server-error.json"
