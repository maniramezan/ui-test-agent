id: "post-v1-tasks"
alias: "Add a task."
reference_name: "createTask"
method: "POST"
path: "/v1/tasks"
tags: ["tasks"]

auth:
  type: bearer
  verify: true
  header_name: null

request_rules:
  cookies:
    - name: "example_session"
      required: true
  requires_body: true
  accepted_content_types:
    - "application/json"

variants:
  - name: "created"
    reference_name: "created"
    description: "The new task."
    default: true
    status: 201
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-tasks/v1-tasks-created.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    description: "The bearer token or the session cookie is missing, expired or wrong."
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-tasks/v1-tasks-unauthorized.json"
  - name: "unprocessableContent"
    reference_name: "unprocessableContent"
    description: "The body failed validation; `fields` names each problem."
    status: 422
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-tasks/v1-tasks-unprocessablecontent.json"
  - name: "serverError"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-tasks/v1-tasks-servererror.json"
