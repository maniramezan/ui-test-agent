id: "post-v1-session"
alias: "Sign in with email and password."
reference_name: "createSession"
method: "POST"
path: "/v1/session"
tags: ["session"]

auth:
  type: none
  verify: false
  header_name: null

request_rules:
  requires_body: true
  accepted_content_types:
    - "application/json"

variants:
  - name: "success"
    reference_name: "success"
    default: true
    status: 200
    headers:
      "Content-Type": "application/json"
      "Set-Cookie": "example_session=example-session; Path=/; HttpOnly; SameSite=Lax"
    body_file: "fixtures/responses/post-v1-session/v1-session-success.json"
  - name: "unauthorized"
    reference_name: "unauthorized"
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-session/v1-session-unauthorized.json"
  - name: "account-disabled"
    reference_name: "accountDisabled"
    status: 403
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-session/v1-session-account-disabled.json"
  - name: "invalid"
    reference_name: "invalid"
    status: 422
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-session/v1-session-invalid.json"
  - name: "server-error"
    reference_name: "serverError"
    status: 500
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-session/v1-session-server-error.json"
  - name: "invalid-credentials"
    reference_name: "invalidCredentials"
    status: 401
    headers:
      "Content-Type": "application/json"
    body_file: "fixtures/responses/post-v1-session/v1-session-invalid-credentials.json"
