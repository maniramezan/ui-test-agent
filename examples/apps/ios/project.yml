name: ExampleApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SwiftCommons:
    url: https://github.com/maniramezan/SwiftCommons
    exactVersion: 0.21.0
  APITrace:
    url: https://github.com/ArjangConsulting/ios-network-recorder
    exactVersion: 1.5.0
  # moqserver's Swift test client is a nested package, so it can't be pinned by URL yet. This
  # path expects a moqserver checkout next to this repo.
  MoqTestSupport:
    path: ../../../../moqserver/server/MoqTestSupport
targets:
  ExampleApp:
    type: application
    platform: iOS
    sources:
      - Sources/ExampleApp
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ExampleApp
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SwiftCommons
        product: SwiftCommons
      - package: APITrace
        product: APITraceCore
      - package: APITrace
        product: APITraceDebug
    scheme:
      testTargets:
        - name: ExampleAppUITests
          parallelizable: true
  ExampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ExampleApp
    dependencies:
      - target: ExampleApp
      - package: MoqTestSupport
        product: MoqTestSupport
